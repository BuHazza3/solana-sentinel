# 24/7 PAPER-ONLY pump.fun bots (no wallets, no keys, no real transactions).
# Each run works ~5h40m, saves encrypted state to the orphan `state` branch, then dispatches the next run.
# The 30-minute cron is only a fallback: it exits at once if a run is already active.
# Does nothing until the encrypted state blob exists on the `state` branch (cutover) or `fresh` is ticked.
name: paper-bots

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Start without saved state (only if the state branch is empty)"
        type: boolean
        default: false
      handover:
        description: "Internal: set by the previous run"
        type: string
        default: "false"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write   # push the encrypted state to the `state` branch (never main)
  actions: write    # dispatch the next run

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RELAY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "RELAY_KEY secret not set"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow bots.yml --limit 20 --json databaseId,status \
                 --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [ "${busy:-0}" != "0" ]; then echo "a run is already active"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  bots:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: paper-bots
      cancel-in-progress: false
    env:
      TZ: Asia/Dubai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: runner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - run: pip install --quiet --disable-pip-version-check -r runner/requirements.txt
      - name: run bots (~5h40m)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FRESH: ${{ inputs.fresh }}
          DISPATCH: "1"
          WORKFLOW_FILE: bots.yml
          RUN_SECONDS: "20400"
          SAVE_EVERY: "900"
        run: python runner/runner.py
