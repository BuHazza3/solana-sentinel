title = "Launch sniper"
kind = "ls"
fees = "snipe"
max_rug_score = 40
max_age_minutes = 30
min_liquidity_usd = 4000
min_progress_pct = 10
max_progress_pct = 85
min_buys_5m = 25
min_buy_sell_ratio = 1.3
