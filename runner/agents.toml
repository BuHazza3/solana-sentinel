# SUB-AGENTS (PAPER ONLY). Each keeps the entry logic and the exits it had in the bot it came from; only agents that
# produced at least one profitable paper trade were kept (see /workspace/consolidate/agents.json for the P/L per agent).
# Sizing and account limits come from the HOST bot (v1_bot.toml / s5_bot.toml), which shares one 1 SOL bankroll.
[general]
paper = true
latency_slippage_bps = 100        # extra adverse move on each fill (quote -> landing)
max_slippage_bps = 500
ata_rent_sol = 0.00203928         # refunded when the token account is closed after the final sell
[fees.normal]                     # from pump_sentinel.toml (C)
sol = 0.000105
[fees.snipe]                      # from pump_sentinel.toml / m4_momentum.toml / s5_quant.toml
sol = 0.000605

# ---------------------------------------------------------------- from V1_SNIPER (pump_sentinel.py, rules in config.toml)
[agent.V1_SNIPE]
origin = "V1_SNIPER · snipe path"
title = "V1 snipe"
kind = "v1"
signal = "snipe"
fees = "snipe"
exit = { engine = "classic", stop_loss_pct = 20, take_profit_pct = 40, trailing_activate_pct = 20, trailing_stop_pct = 12, max_hold_minutes = 20 }
[agent.V1_SCANNER]
origin = "V1_SNIPER · scanner path"
title = "V1 scanner"
kind = "v1"
signal = "scanner"
fees = "snipe"
exit = { engine = "classic", stop_loss_pct = 20, take_profit_pct = 40, trailing_activate_pct = 20, trailing_stop_pct = 12, max_hold_minutes = 20 }
[agent.COPY]
origin = "V1_SNIPER · copy path (watch list in wallets.toml)"
title = "Copy-trade"
kind = "v1"
signal = "copy"
fees = "snipe"
exit_when_leader_sells = true
exit = { engine = "classic", stop_loss_pct = 20, take_profit_pct = 40, trailing_activate_pct = 20, trailing_stop_pct = 12, max_hold_minutes = 20 }

# ---------------------------------------------------------------- from ORIGINAL + REVISED (pump_sentinel.py)
[agent.C_GRAD]
origin = "ORIGINAL + REVISED · momentum C, graduated bucket"
