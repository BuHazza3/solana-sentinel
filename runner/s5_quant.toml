# S5 QUANT (fifth strategy), PAPER ONLY. Built with the "overnight quant desk" method (scout -> backtest -> score -> build),
# applied to pump.fun tokens only. It does NOT reuse rules from ORIGINAL / REVISED / V1_SNIPER / M4.
# Strategy: Outrider "Revival" lane (https://outrider.mikodes.com/docs/lanes), entry and exits exactly as published.
# Backtest verdict (2 Nov 2026, real Jupiter/GeckoTerminal candles, 1,673 tokens): did NOT pass the desk's bar
# (18+/25, PF>1.3, DD<20%, 100+ trades). It is the least-bad candidate and runs as a forward paper test only.
[general]
paper = true
start_balance_sol = 1.0
strategy = "REVIVAL"
scan_interval_seconds = 15           # pump.fun "recently traded" list
recheck_seconds = 60                 # same token's candles fetched at most once a minute
scan_list_pages = 2                  # 2 x 50 most recently traded coins
monitor_interval_seconds = 3
latency_slippage_bps = 100           # extra adverse move on each simulated fill
max_slippage_bps = 500
fee_base_sol = 0.000005
fee_priority_sol = 0.0005
fee_jito_sol = 0.0001
ata_rent_sol = 0.00203928

[entry]                              # Outrider Revival lane
min_age_minutes = 30
quiet_window_minutes = 15
quiet_max_volume_sol = 1.0           # Outrider says "quiet"; 1 SOL in 15 min is our explicit threshold
wake_min_sol = 4.0                   # >= 4 SOL volume AND >= 4 SOL net inflow in the last closed minute
max_price_vs_peak = 0.5              # >= 50% below its peak

[exit]                               # from the strategy card itself
stop_loss_pct = 15
take_profits = [[1.5, 0.5], [2.5, 1.0]]   # [multiple, fraction of the original position]
trail_pct = 20                       # trailing stop on the rest, armed after the first take-profit
max_hold_minutes = 90
price_lost_seconds = 180

[risk]
risk_per_trade_pct = 1.0             # a stop-out costs ~1% of equity -> size = 1% / 15% = ~6.7% of equity
max_position_pct = 10
max_open = 3
daily_stop_pct = 3.0                 # no new entries for the rest of the Dubai day once the day is down 3%
tz_offset_hours = 4
