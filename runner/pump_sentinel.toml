# PUMP.FUN-ONLY sentinel harness (PAPER ONLY). Bonding-curve and graduated tokens are tracked as separate buckets.
# Sentinel strategy-validation harness (PAPER ONLY). Three independent 1-SOL paper accounts are run on the
# same live data at the same time, plus two baselines (hold SOL, no trade).
#   ORIGINAL   = SPEC.txt rules as written (A, B, C + F regime gate)
#   REVISED    = SPEC_REVISIONS.md rules (A, B, C + F, plus the LS launch-sniper tier)
#   V1_SNIPER  = the user's first loose rules (rug filter, then scanner/snipe/copy entries)
[general]
paper = true
start_balance_sol = 1.0
discovery_interval_seconds = 30
reevaluate_minutes = 5
monitor_interval_seconds = 6
latency_slippage_bps = 100        # extra adverse move on each fill (quote -> landing)
max_slippage_bps = 500
ata_rent_sol = 0.00203928         # refunded when the token account is closed after the sell
min_liq_to_fetch_report = 3000
min_activity_buys_5m = 5          # skip dead tokens before spending API calls

[fees.normal]                     # A/B/C swaps
