# ============================================================
#  Solana memecoin PAPER bot config. Paper mode only.
# ============================================================
[mode]
paper = true            # hard-asserted; there is no live-trading code in this build

[rpc]
url = "https://api.mainnet-beta.solana.com"   # free public RPC (rate limited). Paid RPC needed for live.

[risk]
start_balance_sol = 1.0          # user's planned bankroll
position_size_pct = 15           # % of cash balance per trade
max_position_sol = 0.15
min_position_sol = 0.05          # below this, fixed fees eat too much of the trade
max_concurrent_positions = 3
fee_reserve_sol = 0.05           # never spend this (gas + token-account rent buffer)

[costs]                           # modeled Solana execution costs per swap tx
base_fee_sol = 0.000005
priority_fee_sol = 0.0005         # compute-budget priority fee; memecoin snipes often pay more
jito_tip_sol = 0.0001             # MEV-protection tip (bundles); set 0 to disable
ata_rent_sol = 0.00203928         # token-account rent paid on first buy...
close_token_account = true        # ...refunded if the account is closed after selling
max_slippage_bps = 500            # slippage tolerance passed to Jupiter quote
latency_slippage_bps = 100        # extra adverse move assumed between quote and landing (each side)
allow_fallback_fills = true       # if Jupiter has no route, model fill from DexScreener price
fallback_impact_pct = 2.0
fallback_amm_fee_pct = 1.0

[filter]                          # rug filter thresholds
min_liquidity_usd = 20000
max_fdv_usd = 50000000
require_rugcheck = true
max_rugcheck_score_normalised = 40 # RugCheck normalised risk (0 good .. 100 bad)
reject_any_danger_risk = true
allowed_danger_risks = []
min_holders = 100
max_insiders_detected = 5
min_lp_locked_pct = 90             # LP burned/locked % (liquidity-weighted)
allow_clmm_only_liquidity = false  # DLMM/CLMM-only pools: LP can be pulled any time
max_top10_holder_pct = 30          # excludes pools / known program accounts
max_single_holder_pct = 10

[strategy]
discovery_interval_seconds = 30
reevaluate_minutes = 5
scanner_enabled = true
scanner_min_score = 0.6
snipe_enabled = true
snipe_max_age_minutes = 15         # only new launches
snipe_min_buys_5m = 25
snipe_min_buy_sell_ratio = 1.3

[exits]
check_interval_seconds = 5
take_profit_pct = 40
stop_loss_pct = 20
trailing_activate_pct = 20
trailing_stop_pct = 12
max_hold_minutes = 20

[copytrade]
enabled = true
poll_seconds = 30
min_followed_buy_sol = 0.3         # ignore leader buys smaller than this (filters airdrop dust)
exit_when_leader_sells = true
rank_sample_txs = 300
